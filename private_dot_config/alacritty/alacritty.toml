# Alacritty 配置文件 (chezmoi: private_dot_config/alacritty/alacritty.toml -> ~/.config/alacritty/alacritty.toml)
# GPU 加速终端。主题：Catppuccin Mocha（生效的 [colors] 见下方；与 ghostty 及本机 starship 同属 Catppuccin Mocha 主题家族，但 ANSI 亮色变体与 ghostty 内置主题不同；原 Dracula 配色块整块注释保留为备选模板）。
# `private_dot_config` 前缀确保部署后父目录为 0700。
# 文档: https://alacritty.org/config-alacritty.html | 键位: .../config-alacritty-bindings.html
# 参考: https://www.kevnu.com/zh/posts/18

shell = { program = "/opt/homebrew/bin/fish", args = [
  "-c",
  "tmux new -A -s main",
] }

[env]
TERM = "xterm-256color"  # 确保 tmux/ssh 下 256 色 + 真彩
COLORTERM = "truecolor"
LANG = "zh_CN.UTF-8"

# [terminal]
# Alacritty + tmux 的 shell 配置
# shell = { program = "/opt/homebrew/bin/fish", args = [
#   "-c",
#   "tmux new -A -s main",
# ] }
# shell = { program = "/bin/zsh", args = ["-l"] }
# shell = { program = "/opt/homebrew/bin/fish", args = ["-l"] }

[font]
size = 15

# 需要已安装 JetBrainsMono Nerd Font Mono（经 Homebrew `font-jetbrains-mono-nerd-font`）。
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
builtin_box_drawing = true

# 配色: Catppuccin Mocha（生效）——与 ghostty 及本机 starship 同属 Catppuccin Mocha 主题家族（ANSI 亮色变体与 ghostty 内置主题不同）；下方 Dracula 块整块注释保留为备选模板。
[colors]
# primary = { background = '0x282a36', foreground = '0xf8f8f2' }
# cursor = { background = '0x44475a', foreground = '0xf8f8f2' }
# normal = { black = '0x21222c', red = '0xff5555', green = '0x50fa7b', yellow = '0xf1fa8c', blue = '0xbd93f9', magenta = '0xff79c6', cyan = '0x8be9fd', white = '0xbfbfbf' }
# bright = { black = '0x4d4d4d', red = '0xff6e67', green = '0x5af78e', yellow = '0xf4f99d', blue = '0xcaa9fa', magenta = '0xff92d0', cyan = '0x9aedfe', white = '0xe6e6e6' }
# dim = { black = '0x21222c', red = '0xff5555', green = '0x50fa7b', yellow = '0xf1fa8c', blue = '0xbd93f9', magenta = '0xff79c6', cyan = '0x8be9fd', white = '0xbfbfbf' }

primary = { background = "#1e1e2e", foreground = "#cdd6f4" }
normal = { black = "#45475a", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#cba6f7", cyan = "#94e2d5", white = "#bac2de" }
bright = { black = "#585b70", red = "#f38ba8", green = "#a6e3a1", yellow = "#f9e2af", blue = "#89b4fa", magenta = "#cba6f7", cyan = "#94e2d5", white = "#a6adc8" }

[window]
resize_increments = true

padding = { x = 10, y = 10 }
# opacity = 0.85
option_as_alt = "OnlyRight"  # 左 Option 保留用于输入（如变音符），右 Option = Alt/Meta
dimensions = { columns = 160, lines = 48 }  # 示例: 固定启动尺寸
decorations = "full"  # 示例: 完整窗口装饰（红绿灯按钮）
# decorations = "Buttonless"                  # 示例: 隐藏红绿灯按钮
startup_mode = "Fullscreen"
dynamic_title = true

[scrolling]
history = 1000
multiplier = 3

[selection]
save_to_clipboard = true  # 选区直接复制到系统剪贴板

[keyboard]
# 键位绑定 —— 见 https://github.com/theniceboy/.config/blob/master/alacritty/alacritty.yml
bindings = [
  # { key = "Return", mods = "Command", action = "ToggleSimpleFullscreen" },
  { mods = "Command", key = "Enter", action = "ToggleFullscreen" },
  # { key = "N", mods = "Control", command = "tm" },
  # { key = "F", mods = "Function", action = "ToggleFullscreen" },
  # { key = "N", mods = "Alt", action = "ReceiveChar" },
  # { key = "P", mods = "Alt", action = "ReceiveChar" },
  { mods = "Command", key = "t", action = "None" },  # 禁用: 交给 shell/tmux 处理新标签页
  { mods = "Command", key = "n", action = "None" },  # 禁用: 交给 shell/tmux 处理新窗口
]
