# mise 全局工具版本 (chezmoi: private_dot_config/mise/config.toml -> ~/.config/mise/config.toml, 目录 0700)
# `mise use -g <tool>@<version>` 更新本文件；`mise install` 同步安装。
# 每个条目跟踪最新稳定版 ("latest")；如需锁定版本可改为具体版本号 (如 node = "20")。
# 工具清单与安装说明见 docs/dev-tools.md 与 aliases.zsh 的 update-all。
# Author: Payne

[tools]
bun = "latest"   # JS 运行时与包管理 (Bun)
deno = "latest"  # JS/TS 运行时 (Deno)
go = "latest"    # Go 工具链 (GOPATH 统一为 ~/.local/share/go，见 zsh/sdk.zsh 与 fish/00_env.fish)
node = "latest"  # Node.js 最新稳定版 (pnpm 依赖其；如需 LTS 可改锁主版本号如 "22")
pnpm = "latest"  # JS 包管理器 (高效磁盘利用)
