# macOS 版 kitty 的个人配置。
# 本文件由 kitty.conf 引入；未列出的选项继续使用 kitty 默认值。
# 注意：kitty 不会自动读取本文件；新机器需在 kitty 首次生成的 ~/.config/kitty/kitty.conf 末尾手工添加 "include kitty.local.conf"（仓库有意不含 kitty.conf）。

# 字体与光标
# 使用已安装的 JetBrains Nerd Font 等宽字体。
font_family JetBrainsMono Nerd Font Mono
# 设置终端字体大小（单位：磅）。
font_size 15.0
# 光标位于连字上时暂时关闭连字，便于编辑代码。
disable_ligatures cursor
# 使用实心方块作为活动光标。
cursor_shape block
# 窗口失去焦点时使用空心光标。
cursor_shape_unfocused hollow
# 设置光标闪烁间隔为 0.5 秒。
cursor_blink_interval 0.5
# 键盘停止操作 15 秒后停止光标闪烁。
cursor_stop_blinking_after 15

# 窗口布局
# 设置终端内容四周的内边距为 12 磅。
window_padding_width 12
# 不在窗口边缘额外增加外边距。
window_margin_width 0
# 设置分屏窗口边框宽度为 1 磅。
window_border_width 1.0pt
# 只绘制分隔相邻窗口所需的最小边框。
draw_minimal_borders yes
# 设置活动窗口边框颜色为紫色。
active_border_color #cba6f7
# 设置非活动窗口边框颜色为深灰色。
inactive_border_color #45475a

# 标签页
# 使用 powerline 风格显示标签页栏。
tab_bar_style powerline
# 使用圆角样式连接 powerline 标签页。
tab_powerline_style round
# 至少有两个标签页时才显示标签页栏。
tab_bar_min_tabs 2
# 设置标签页栏背景色。
tab_bar_background #181825
# 关闭标签页后切换到最近使用的标签页。
tab_switch_strategy previous
# 设置活动标签页的文字颜色。
active_tab_foreground #1e1e2e
# 设置活动标签页的背景颜色。
active_tab_background #cba6f7
# 使用粗体显示活动标签页。
active_tab_font_style bold
# 设置非活动标签页的文字颜色。
inactive_tab_foreground #bac2de
# 设置非活动标签页的背景颜色。
inactive_tab_background #313244
# 使用普通字重显示非活动标签页。
inactive_tab_font_style normal
# 在标签页标题中显示工作目录的最后两级路径，并限制长度。
tab_title_template "{index}: {'/'.join(tab.active_wd.split('/')[-2:])}"
# 将标签页标题最长限制为 30 个字符单元格。
tab_title_max_length 30

# Catppuccin Mocha 配色
# 设置默认前景色。
foreground #cdd6f4
# 设置默认背景色。
background #1e1e2e
# 设置光标颜色。
cursor #f5e0e6
# 设置光标所在单元格中的文字颜色。
cursor_text_color #1e1e2e
# 设置选中文字颜色。
selection_foreground #cdd6f4
# 设置选区背景颜色。
selection_background #45475a
# 设置基础黑色。
color0 #45475a
# 设置基础红色。
color1 #f38ba8
# 设置基础绿色。
color2 #a6e3a1
# 设置基础黄色。
color3 #f9e2af
# 设置基础蓝色。
color4 #89b4fa
# 设置基础洋红色。
color5 #f5c2e7
# 设置基础青色。
color6 #94e2d5
# 设置基础白色。
color7 #bac2de
# 设置明亮黑色。
color8 #585b70
# 设置明亮红色。
color9 #f38ba8
# 设置明亮绿色。
color10 #a6e3a1
# 设置明亮黄色。
color11 #f9e2af
# 设置明亮蓝色。
color12 #89b4fa
# 设置明亮洋红色。
color13 #f5c2e7
# 设置明亮青色。
color14 #94e2d5
# 设置明亮白色。
color15 #a6adc8

# 回滚、选择与粘贴安全
# 保存 10000 行终端回滚内容。
scrollback_lines 10000
# 为回滚分页器额外保留 64 MB 历史记录。
scrollback_pager_history_size 64
# 鼠标选择文字时不自动复制到系统剪贴板。
copy_on_select no
# 复制文字时智能移除行尾空格。
strip_trailing_spaces smart
# 粘贴网址时自动引用，并对危险或大段内容进行确认。
paste_actions quote-urls-at-prompt,confirm,confirm-if-large
# 自动检测终端中的网址。
detect_urls yes
# 设置网址高亮颜色。
url_color #89b4fa
# 使用波浪线样式标记网址。
url_style curly
# 仅在鼠标悬停时给超链接加下划线。
underline_hyperlinks hover
# 打开应用生成的超链接前先询问。
allow_hyperlinks ask
# 允许写入剪贴板，但读取剪贴板时要求确认。
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

# Shell、权限与性能
# 启用 kitty shell 集成，但不让它改成 beam 光标。
shell_integration no-cursor
# 将 kitty 默认 shell 固定为 fish（默认取自 $SHELL/passwd，本机为 /bin/zsh；此举与 Ghostty 的 command、tmux 的 default-shell 统一为 fish）。
shell /opt/homebrew/bin/fish --login --interactive
# 禁止程序通过远程控制接口操作 kitty。
allow_remote_control no
# 程序请求克隆窗口时先询问。
allow_cloning ask
# 向终端程序声明 kitty 的完整终端能力。
term xterm-kitty
# 关闭正在运行任务的窗口前进行确认。
confirm_os_window_close -1
# 保持默认的 3 毫秒输入延迟，兼顾响应速度与稳定性。
input_delay 3
# 每 10 毫秒最多重绘一次屏幕。
repaint_delay 10
# 将重绘同步到显示器刷新率，避免撕裂。
sync_to_monitor yes
# 不可见窗口中的命令运行超过 10 秒后发送通知。
notify_on_cmd_finish invisible 10

# 安静但明显的提示音
# 禁用终端音频铃声。
enable_audio_bell no
# 使用 0.15 秒的视觉闪烁代替声音。
visual_bell_duration 0.15
# 设置视觉提示闪烁颜色。
visual_bell_color #f38ba8
# 铃声发生时请求 macOS 提醒窗口。
window_alert_on_bell yes
# 在有铃声的标签页标题前显示铃铛符号。
bell_on_tab "🔔 "

# macOS 行为
# 将左 Option 键作为 Alt，保留右 Option 键用于输入特殊字符。
macos_option_as_alt left
# 让 kitty 标题栏使用当前终端背景色。
macos_titlebar_color background
# 最后一个窗口关闭后退出 kitty。
macos_quit_when_last_window_closed yes

# 常用快捷键
# 使用 Command+逗号编辑 kitty 配置文件。
map cmd+, edit_config_file
# 使用 Control+Command+逗号重新加载 kitty 配置。
map ctrl+cmd+, load_config_file
# 使用 Command+K 清除当前提示符之前的内容。
map cmd+k clear_terminal to_cursor active
# 使用 Command+Shift+L 清除上一条命令及其输出。
map cmd+shift+l clear_terminal last_command active
# 使用 Command+Shift+Enter 在当前目录旁边打开新窗口。
map cmd+shift+enter launch --location=neighbor --cwd=current

# 标签页切换快捷键
# Command+1 跳转到第一个标签页。
map cmd+1 goto_tab 1
# Command+2 跳转到第二个标签页。
map cmd+2 goto_tab 2
# Command+3 跳转到第三个标签页。
map cmd+3 goto_tab 3
# Command+4 跳转到第四个标签页。
map cmd+4 goto_tab 4
# Command+5 跳转到第五个标签页。
map cmd+5 goto_tab 5
# Command+6 跳转到第六个标签页。
map cmd+6 goto_tab 6
# Command+7 跳转到第七个标签页。
map cmd+7 goto_tab 7
# Command+8 跳转到第八个标签页。
map cmd+8 goto_tab 8
# Command+9 跳转到最近使用的标签页。
map cmd+9 goto_tab -1

map cmd+d launch --location=hsplit
map cmd+shift+d launch --location=vsplit
map cmd+] next_window
map cmd+[ previous_window

# 标签页管理快捷键
# 使用 Command+T 在 ~/workspaces 中打开新标签页。
map cmd+t launch --type=tab --cwd=~/workspaces
