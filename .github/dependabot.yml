version: 3

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    rebase-strategy: disabled

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    rebase-strategy: disabled
