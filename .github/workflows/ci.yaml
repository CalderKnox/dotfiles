name: CI

# 五阶段验收流水线：测试 → 验证 → 评估 → 确认 → 验收。
# 每个阶段把自己的证据（日志 + result.json）上传为 artifact，下一阶段只读取证据，
# 不重新解释上游结论；最后一个 `accept` 作业是所有阶段的门，分支保护只需要求它。
#
#   test      测试：严格离线套件（源码契约 + 隔离运行时回归）
#   verify    验证：workflow 语法、真实 fzf 行为、入口文档一致性
#   evaluate  评估：对上游证据打分，并用历史基线负对照证明门禁确实会失败
#   confirm   确认：独立复核证据链完整性，并重跑部署边界等不变式
#   accept    验收：聚合四个阶段，全部通过才放行
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  test:
    name: 测试 (test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: brew install chezmoi fish fzf lua neovim tmux

      - name: 测试 / 运行严格离线套件
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence/test"
          python3 docs/validation/check.py --strict 2>&1 | tee "$RUNNER_TEMP/ci-evidence/test/check.log"

      - name: 测试 / 记录证据
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          log="$RUNNER_TEMP/ci-evidence/test/check.log"
          mkdir -p "$RUNNER_TEMP/ci-evidence/test"
          tests=0
          skips=0
          if [ -f "$log" ]; then
            found=$(sed -nE 's/^Ran ([0-9]+) tests?.*/\1/p' "$log" | tail -1)
            if [ -n "$found" ]; then tests=$found; fi
            skips=$(grep -cE '\.\.\. skipped' "$log" || true)
          fi
          printf '{"stage":"test","status":"%s","commit":"%s","runner":"%s","tests":%s,"skips":%s}\n' \
            "$JOB_STATUS" "$GITHUB_SHA" "$RUNNER_OS" "$tests" "$skips" > "$RUNNER_TEMP/ci-evidence/test/result.json"
          {
            printf '### 测试 (test): %s\n\n' "$JOB_STATUS"
            printf -- '- 用例数: %s\n' "$tests"
            printf -- '- skip 数: %s（严格模式要求 0）\n' "$skips"
            printf -- '- 提交: %s\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
          # 绿色作业必须带可读的用例计数；否则说明套件根本没跑起来，不能记成通过。
          if [ "$JOB_STATUS" = "success" ] && [ "$tests" -eq 0 ]; then
            printf 'test: suite reported no test runs; refusing to record green evidence\n' >&2
            exit 1
          fi

      - name: 测试 / 上传证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-evidence
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: 验证 (verify)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: brew install actionlint fzf

      # 每个检查都带 `if: always()`：一个失败不能掩盖其余检查的证据，
      # 作业整体仍然因为失败步骤而变红。
      - name: 验证 / workflow 语法
        id: actionlint
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence/verify"
          # actionlint 成功时没有输出；显式写入结论，证据文件才不会为空。
          if actionlint -color 2>&1 | tee "$RUNNER_TEMP/ci-evidence/verify/actionlint.log"; then
            printf 'actionlint: no findings\n' | tee -a "$RUNNER_TEMP/ci-evidence/verify/actionlint.log"
          else
            printf 'actionlint: findings reported above\n' | tee -a "$RUNNER_TEMP/ci-evidence/verify/actionlint.log"
            exit 1
          fi

      - name: 验证 / 真实 fzf 行为
        id: fzf
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence/verify"
          python3 docs/validation/fzf_runtime.py 2>&1 | tee "$RUNNER_TEMP/ci-evidence/verify/fzf.log"

      - name: 验证 / 入口文档一致性
        id: entrypoints
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/ci-evidence/verify"
          python3 docs/validation/check.py SourceChecks.test_ci_workflow_runs_documented_entrypoints \
            2>&1 | tee "$RUNNER_TEMP/ci-evidence/verify/entrypoints.log"

      - name: 验证 / 记录证据
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          FZF_OUTCOME: ${{ steps.fzf.outcome }}
          ENTRYPOINTS_OUTCOME: ${{ steps.entrypoints.outcome }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ci-evidence/verify"
          printf '{"stage":"verify","status":"%s","commit":"%s","runner":"%s","checks":{"actionlint":"%s","fzf_runtime":"%s","entrypoints":"%s"}}\n' \
            "$JOB_STATUS" "$GITHUB_SHA" "$RUNNER_OS" \
            "$ACTIONLINT_OUTCOME" "$FZF_OUTCOME" "$ENTRYPOINTS_OUTCOME" > "$RUNNER_TEMP/ci-evidence/verify/result.json"
          {
            printf '### 验证 (verify): %s\n\n' "$JOB_STATUS"
            printf -- '- actionlint: %s\n' "$ACTIONLINT_OUTCOME"
            printf -- '- fzf_runtime: %s\n' "$FZF_OUTCOME"
            printf -- '- entrypoints: %s\n' "$ENTRYPOINTS_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 验证 / 上传证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-evidence
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: warn

  evaluate:
    name: 评估 (evaluate)
    needs: [test, verify]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 负对照需要读取历史基线提交 b4e8bac 的源码。
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install evaluation dependencies
        run: brew install chezmoi fish neovim tmux

      - name: 评估 / 收集上游证据
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-evidence"
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: true

      - name: 评估 / 复核上游证据
        id: upstream
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -o pipefail
          set -u
          mkdir -p "$RUNNER_TEMP/ci-evidence/evaluate"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ci-evidence/evaluate/upstream.log"
          import json
          import os
          import pathlib
          import sys

          problems = []
          for stage in ("test", "verify"):
            expected = os.environ[stage.upper() + "_RESULT"]
            path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-evidence" / stage / "result.json"
            if not path.is_file():
              problems.append(f"{stage}: missing {path}")
              continue
            data = json.loads(path.read_text())
            if expected != "success":
              problems.append(f"{stage}: upstream job result is {expected}")
            if data.get("status") != "success":
              problems.append(f"{stage}: evidence status is {data.get('status')}")
            if data.get("commit") != os.environ["GITHUB_SHA"]:
              problems.append(f"{stage}: evidence commit {data.get('commit')} != {os.environ['GITHUB_SHA']}")

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-evidence" / "test/check.log"
          if not log.is_file() or not log.read_text():
            problems.append("test: missing or empty check.log")
          else:
            text = log.read_text()
            if "Ran " not in text or "\nOK" not in text:
              problems.append("test: check.log does not report a passing run")
            if "... skipped" in text:
              problems.append("test: check.log contains skipped tests")

          for problem in problems:
            print(f"FAIL {problem}")
          if problems:
            sys.exit(1)
          print("upstream evidence: clean")
          PY

      - name: 评估 / 历史基线负对照
        id: controls
        if: always()
        run: |
          set -o pipefail
          python3 docs/validation/negative_controls.py 2>&1 | tee "$RUNNER_TEMP/ci-evidence/evaluate/negative_controls.log"

      - name: 评估 / 汇总评分
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPSTREAM_OUTCOME: ${{ steps.upstream.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
        run: |
          set -u
          log="$RUNNER_TEMP/ci-evidence/evaluate/negative_controls.log"
          reproduced=0
          total=0
          invalid=0
          if [ -f "$log" ]; then
            summary=$(grep -Eo '[0-9]+/[0-9]+ reproduced; [0-9]+ invalid controls' "$log" | tail -1 || true)
            if [ -n "$summary" ]; then
              reproduced=${summary%%/*}
              total=${summary#*/}
              total=${total%% *}
              invalid=${summary##*; }
              invalid=${invalid%% *}
            fi
          fi
          printf '{"stage":"evaluate","status":"%s","commit":"%s","runner":"%s","upstream":"%s","negatives":"%s","reproduced":%s,"controls":%s,"invalid_controls":%s}\n' \
            "$JOB_STATUS" "$GITHUB_SHA" "$RUNNER_OS" "$UPSTREAM_OUTCOME" "$CONTROLS_OUTCOME" \
            "$reproduced" "$total" "$invalid" > "$RUNNER_TEMP/ci-evidence/evaluate/result.json"
          {
            printf '### 评估 (evaluate): %s\n\n' "$JOB_STATUS"
            printf -- '- 上游证据复核: %s\n' "$UPSTREAM_OUTCOME"
            printf -- '- 负对照: %s\n' "$CONTROLS_OUTCOME"
            printf -- '- 复现: %s/%s（无效控制 %s）\n' "$reproduced" "$total" "$invalid"
          } >> "$GITHUB_STEP_SUMMARY"
          # 负对照跑绿却没有可解析的汇总，说明评估器本身失效了。
          if [ "$CONTROLS_OUTCOME" = "success" ] && [ "$total" -eq 0 ]; then
            printf 'evaluate: negative-control summary could not be parsed\n' >&2
            exit 1
          fi

      - name: 评估 / 上传证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluate-evidence
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: warn

  confirm:
    name: 确认 (confirm)
    needs: [test, verify, evaluate]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install confirmation dependencies
        run: brew install chezmoi

      - name: 确认 / 收集证据链
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-evidence"
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: true

      # 独立复核：不信任上游结论，逐项检查证据文件本身（存在、同提交、状态、日志非空）。
      - name: 确认 / 证据链完整性
        id: chain
        if: always()
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ci-evidence/confirm"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ci-evidence/confirm/chain.log"
          import json
          import os
          import pathlib
          import sys

          commit = os.environ["GITHUB_SHA"]
          required = {
            "test": ["result.json", "check.log"],
            "verify": ["result.json", "actionlint.log", "fzf.log", "entrypoints.log"],
            "evaluate": ["result.json", "negative_controls.log"],
          }
          problems = []
          for stage, names in required.items():
            root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-evidence" / stage
            for name in names:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                problems.append(f"{stage}: missing or empty {path}")
            result = root / "result.json"
            if result.is_file():
              data = json.loads(result.read_text())
              if data.get("status") != "success":
                problems.append(f"{stage}: recorded status {data.get('status')}")
              if data.get("commit") != commit:
                problems.append(f"{stage}: recorded commit {data.get('commit')} != {commit}")
          if problems:
            for problem in problems:
              print(f"FAIL {problem}")
            sys.exit(1)
          print("evidence chain: complete and consistent")
          PY

      - name: 确认 / 重跑部署边界与工作流契约
        id: invariants
        if: always()
        run: |
          set -o pipefail
          python3 docs/validation/check.py \
            SourceChecks.test_ci_workflow_runs_documented_entrypoints \
            SourceChecks.test_no_unexpected_top_level_deploy_target \
            SourceChecks.test_chezmoi_source_boundaries_without_apply \
            SourceChecks.test_relative_documentation_links_exist \
            SourceChecks.test_validation_modules_suppress_bytecode_and_stay_clean \
            2>&1 | tee "$RUNNER_TEMP/ci-evidence/confirm/confirm.log"

      - name: 确认 / 记录证据
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHAIN_OUTCOME: ${{ steps.chain.outcome }}
          INVARIANTS_OUTCOME: ${{ steps.invariants.outcome }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/ci-evidence/confirm"
          printf '{"stage":"confirm","status":"%s","commit":"%s","runner":"%s","evidence_chain":"%s","invariants":"%s"}\n' \
            "$JOB_STATUS" "$GITHUB_SHA" "$RUNNER_OS" "$CHAIN_OUTCOME" "$INVARIANTS_OUTCOME" \
            > "$RUNNER_TEMP/ci-evidence/confirm/result.json"
          {
            printf '### 确认 (confirm): %s\n\n' "$JOB_STATUS"
            printf -- '- 证据链完整性: %s\n' "$CHAIN_OUTCOME"
            printf -- '- 不变式重跑: %s\n' "$INVARIANTS_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 确认 / 上传证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: confirm-evidence
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: warn

  accept:
    name: 验收 (accept)
    needs: [test, verify, evaluate, confirm]
    # 任一上游失败也要运行到底，才能给出「哪个阶段没过」的验收结论。
    if: always()
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: 验收 / 收集全部证据
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-evidence"
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: true

      - name: 验收 / 判定
        if: always()
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          EVALUATE_RESULT: ${{ needs.evaluate.result }}
          CONFIRM_RESULT: ${{ needs.confirm.result }}
        run: |
          set -o pipefail
          set -u
          mkdir -p "$RUNNER_TEMP/ci-evidence/accept"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ci-evidence/accept/acceptance.log"
          import json
          import os
          import pathlib
          import sys

          stages = ("test", "verify", "evaluate", "confirm")
          problems = []
          rows = []
          for stage in stages:
            job_result = os.environ[stage.upper() + "_RESULT"]
            result_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-evidence" / stage / "result.json"
            evidence_status = "missing"
            if result_path.is_file():
              evidence_status = json.loads(result_path.read_text()).get("status", "unknown")
            accepted = job_result == "success" and evidence_status == "success"
            rows.append((stage, job_result, evidence_status, accepted))
            if not accepted:
              problems.append(f"{stage}: job={job_result} evidence={evidence_status}")

          print("| 阶段 | 作业结果 | 证据状态 | 放行 |")
          print("| --- | --- | --- | --- |")
          for stage, job_result, evidence_status, accepted in rows:
            print(f"| {stage} | {job_result} | {evidence_status} | {'yes' if accepted else 'no'} |")

          record = {
            "stage": "accept",
            "status": "success" if not problems else "failure",
            "commit": os.environ["GITHUB_SHA"],
            "runner": os.environ["RUNNER_OS"],
            "stages": {stage: {"job": job, "evidence": evidence, "accepted": ok} for stage, job, evidence, ok in rows},
          }
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ci-evidence/accept/acceptance.json").write_text(
            json.dumps(record, indent=2) + "\n"
          )

          if problems:
            print("REJECTED: " + "; ".join(problems))
            sys.exit(1)
          print("ACCEPTED: all five phases passed")
          PY

      - name: 验收 / 汇总
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -u
          {
            printf '### 验收 (accept): %s\n\n' "$JOB_STATUS"
            cat "$RUNNER_TEMP/ci-evidence/accept/acceptance.log"
            printf '\n提交: %s\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 验收 / 上传结论
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accept-evidence
          path: ${{ runner.temp }}/ci-evidence/
          retention-days: 7
          if-no-files-found: warn
