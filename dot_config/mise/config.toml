# mise global tool versions (chezmoi: dot_config/mise/config.toml -> ~/.config/mise/config.toml, default perms)
# `mise use -g <tool>@<version>` 更新本文件；`mise install` 同步安装。
# bun/deno/go/pnpm 使用 latest 浮动选择器；node 固定为 24.19.0。
# 浮动选择器的跨机器版本可能不同；更新 node pin 前请确认兼容性并验证。
# 工具清单与安装说明见 docs/dev-tools.md 与 aliases.zsh 的 update-all。
# Author: Payne

[tools]
bun = "latest"  # JS 运行时与包管理 (Bun)
deno = "latest"  # JS/TS 运行时 (Deno)
go = "latest"  # Go 工具链 (GOPATH 统一为 ~/.local/share/go，见 zsh/sdk.zsh 与 fish/00_env.fish)
node = "24.19.0"  # Node.js pinned version (pnpm depends on Node; change this pin deliberately).
pnpm = "latest"  # JS 包管理器 (高效磁盘利用)
