# =============================================================================
# ~/.tmux.conf (chezmoi: dot_tmux.conf -> ~/.tmux.conf)
# =============================================================================
# Description : tmux 主配置 — Fish 为默认 shell，启用扩展键、鼠标与大历史；
#               插件经 tpm 管理，状态栏用 Catppuccin Mocha。
# Usage       : `tmux` 启动；修改后 `prefix + r` 重载或 `tmux source-file ~/.tmux.conf`
# Guards      : 依赖 Fish/tpm 已安装（default-shell 硬依赖 Fish，未装时新面板
#               无法创建；不再设 default-command，使 tmux 以“登录 shell”语义
#               启动 Fish，与 Ghostty/Alacritty 路径一致）
#               插件未安装时显示一行 prefix+I 提示，不阻塞启动（首次需 `prefix + I` 安装）
# Author      : Payne
# =============================================================================

# ---------------------------------------------------------------------------
# General — 终端与 shell
# ---------------------------------------------------------------------------
set-option -g default-shell "/opt/homebrew/bin/fish"  # 登录 shell → Fish (与 Ghostty/Alacritty 一致；不设 default-command，保持登录语义)

set -as terminal-overrides ",xterm-256color:RGB"      # 真彩支持
set -g mouse on
set -g history-limit 100000                            # 大回滚缓冲 (100k 行)

set -g extended-keys on                                # 扩展键 (CSI-u)，配合 Ghostty/Alacritty
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

set -g renumber-windows on                             # 关闭窗口后自动重编号
set -g set-clipboard on                                # 与系统剪贴板互通

# ---------------------------------------------------------------------------
# 键位绑定
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"  # prefix+r 重载

# ---------------------------------------------------------------------------
# 插件 — tpm (https://github.com/tmux-plugins/tpm)
# 安装: `prefix + I`（安装）/ `prefix + U`（更新）/ `prefix + alt+u`（卸载）
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# General — sensible 默认、复制/粘贴增强（tmux-copy 已移除：仓库不存在，
# git ls-remote 404，prefix+I 安装会报错；复制功能由 tmux-yank 覆盖）
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Session persistence (按需启用 — 历史已注释，保留为模板)
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @resurrect-capture-pane-contents 'on'

# Vim/nvim 导航增强 (按需启用)
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ---------------------------------------------------------------------------
# 状态栏 — Catppuccin Mocha
# ---------------------------------------------------------------------------
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1                              # 窗口/面板均从 1 开始

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# TPM 初始化（必须置于文件末尾；缺失时显示 prefix+I 提示，不阻塞启动，首次需 prefix+I 安装）
if-shell "[ -f ~/.config/tmux/plugins/tpm/tpm ]" "run '~/.config/tmux/plugins/tpm/tpm'" "display-message 'tpm not installed: prefix+I to install'"
