# =============================================================================
# ~/.tmux.conf (chezmoi: dot_tmux.conf -> ~/.tmux.conf)
# =============================================================================
# Description : tmux 主配置 — 继承默认登录 shell，启用扩展键、鼠标与大历史；
#               插件经 tpm 管理，状态栏用 Catppuccin Mocha。
# Usage       : `tmux` 启动；修改后 `prefix + r` 重载或 `tmux source-file ~/.tmux.conf`
# Guards      : 不设 default-shell/default-command，保留 tmux 的登录 shell 默认值
#               支持 XDG 与传统 TPM 安装目录；只有 TPM 的目录不抢占含 Catppuccin 的传统插件根
#               theme → status composition → TPM collector interpolation，冷启动/重载一致
# Author      : Payne
# =============================================================================

# ---------------------------------------------------------------------------
# General — 终端与 shell
# ---------------------------------------------------------------------------
# 不覆盖 default-shell/default-command：由 tmux 根据启动环境选择登录 shell。
# Ghostty/Alacritty 经 Zsh 启动；新面板保留 tmux 默认的登录语义。

# 只追加缺失的规则，保留 tmux 默认与其他插件规则；重载不得无限累积。
if-shell -F '#{m/r:(^| )xterm-256color:RGB($| ),#{terminal-overrides}}' '' \
    'set -as terminal-overrides ",xterm-256color:RGB"'  # 真彩支持
set -g mouse on
set -g history-limit 100000                            # 大回滚缓冲 (100k 行)

set -g extended-keys on                                # 扩展键 (CSI-u)，配合 Ghostty/Alacritty
if-shell -F '#{m/r:(^| )xterm[*]:extkeys($| ),#{terminal-features}}' '' \
    "set -as terminal-features 'xterm*:extkeys'"
set -g extended-keys-format csi-u

set -g renumber-windows on                             # 关闭窗口后自动重编号
set -g set-clipboard on                                # 与系统剪贴板互通

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"  # prefix+r 重载
bind %   split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# TPM 与插件根目录必须一致；尊重显式 TMUX_PLUGIN_MANAGER_PATH。
# 若 XDG 缺少 Catppuccin，而传统目录含 TPM 与 Catppuccin，则选择传统目录。
if-shell -F '#{==:#{TMUX_PLUGIN_MANAGER_PATH},}' {
    if-shell '[ -x "$HOME/.config/tmux/plugins/tpm/tpm" ] || [ ! -x "$HOME/.tmux/plugins/tpm/tpm" ]' {
        if-shell '[ ! -x "$HOME/.config/tmux/plugins/tmux/catppuccin.tmux" ] && [ -x "$HOME/.tmux/plugins/tpm/tpm" ] && [ -x "$HOME/.tmux/plugins/tmux/catppuccin.tmux" ]' {
            set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins/'
        } {
            set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'
        }
    } {
        set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins/'
    }
}

# ---------------------------------------------------------------------------
# Plugins — tpm (https://github.com/tmux-plugins/tpm)
# Install: `prefix + I` (install) / `prefix + U` (update) / `prefix + alt+u` (uninstall)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# General — sensible 默认、复制/粘贴增强（tmux-copy 已移除：仓库不存在，
# git ls-remote 404，prefix+I 安装会报错；复制功能由 tmux-yank 覆盖）
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Session persistence (按需启用 — 历史已注释，保留为模板)
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @resurrect-capture-pane-contents 'on'

# Vim/nvim 导航增强 (按需启用)
# set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-pain-control'
# set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# ---------------------------------------------------------------------------
# Status bar — Catppuccin Mocha
# ---------------------------------------------------------------------------
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1                              # 窗口/面板均从 1 开始

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

set -g @catppuccin_window_status_style "rounded"
# Catppuccin 必须先提供模块定义，之后的 -F 才能保留 CPU/battery collector 占位符。
if-shell '[ -x "$TMUX_PLUGIN_MANAGER_PATH/tmux/catppuccin.tmux" ]' {
    run-shell '"$TMUX_PLUGIN_MANAGER_PATH/tmux/catppuccin.tmux"'
}
# 当前 Catppuccin 无 RAM 模块；使用已有 tmux-cpu 的 ram_percentage，不增加插件。
set -ogq @catppuccin_status_ram '#[fg=#{@thm_bg},bg=#{@thm_blue}] RAM #[fg=#{@thm_fg},bg=#{@thm_surface_0}]#{l:#{ram_percentage}} #[default]'
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# TPM 最后运行，将已构建 status 中的 CPU/RAM/battery 占位符转为 collector 命令。
# prefix+I 仅在 TPM 已安装后有效；manager 自身的安装说明见 docs/terminals.md。
if-shell '[ -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm" ]' {
    run-shell '"$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"'
} {
    display-message 'TPM missing: install tmux-plugins/tpm first; see docs/terminals.md'
}
